[build]
target = "riscv32im-unknown-none-elf"

[target.riscv32im-unknown-none-elf]
rustflags = [
  "-C", "link-arg=-T../../../../nightstream-sdk/guest/riscv32im-unknown-none-elf.ld",
  "-C", "link-arg=--defsym=_STACK_PTR=0xFE00",
]

[env]
# The repo sets RUSTFLAGS globally for host builds. That breaks cross-compiling this guest.
RUSTFLAGS = ""
