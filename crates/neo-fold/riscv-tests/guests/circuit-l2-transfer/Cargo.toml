[package]
name = "circuit-l2-transfer"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "circuit_l2_transfer"
path = "src/main.rs"

# Standalone guest project: do not inherit the repo workspace.
[workspace]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[dependencies]
nightstream-sdk = { path = "../../../../nightstream-sdk", default-features = false }
